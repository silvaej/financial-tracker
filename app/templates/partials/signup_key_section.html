{% import "macros.html" as macros %}
<div class="flex flex-col gap-5">
  <input type="hidden" name="invite_key" value="{{ invite_key or '' }}">
  {% if key_error %}<p class="text-sm text-rust">{{ key_error }}</p>{% endif %}
  <div class="provider-stack">
    <button type="submit"
            formaction="/auth/google/start"
            class="provider-btn"
            {{ "disabled" if not key_valid else "" }}>
      {{ macros.icon_google() }}
      Continue with Google
    </button>
    <button type="submit"
            formaction="/auth/github/start"
            class="provider-btn"
            {{ "disabled" if not key_valid else "" }}>
      {{ macros.icon_github() }}
      Continue with GitHub
    </button>
  </div>
</div>
